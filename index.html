<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AURA — Next-Generation Mobile Banking</title>
    <meta name="description" content="Experience the future of digital banking with AURA. Minimal black & charcoal interface, instant transfers, smart vaults, and effortless wealth management." />
    
    <!-- Modern Sans Typography: Geist & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- PWA & Mobile Web App Capabilities -->
    <meta name="application-name" content="AURA" />
    <meta name="apple-mobile-web-app-title" content="AURA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B0C0E" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body class="bg-[#0B0C0E] text-white antialiased selection:bg-white/20 selection:text-white min-h-screen overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
